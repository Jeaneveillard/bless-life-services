<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Bless Life Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="shell">
    <header class="header">
      <p class="eyebrow">Bless Life Services</p>
      <h1>Content admin</h1>
      <p class="lede">Update prices, payment links, candle details, and a few site fields. Save once when you are done.</p>
    </header>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section id="login-view" class="panel">
      <h2>Sign in</h2>
      <form id="login-form" class="form">
        <label>
          Password
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn--primary">Login</button>
      </form>
    </section>

    <section id="form-view" class="panel" hidden>
      <form id="content-form" class="form">
        <fieldset>
          <legend>Notary</legend>
          <label>Display price <input type="text" name="notary.price" data-path="notary.price"></label>
          <label>Stripe link <input type="url" name="notary.stripe" data-path="notary.stripe" placeholder="https://"></label>
          <label>PayPal link <input type="url" name="notary.paypal" data-path="notary.paypal" placeholder="https://"></label>
        </fieldset>

        <fieldset>
          <legend>CPR</legend>
          <label>Display price <input type="text" name="cpr.price" data-path="cpr.price"></label>
          <label>Stripe link <input type="url" name="cpr.stripe" data-path="cpr.stripe" placeholder="https://"></label>
          <label>PayPal link <input type="url" name="cpr.paypal" data-path="cpr.paypal" placeholder="https://"></label>
        </fieldset>

        <fieldset>
          <legend>Officiant</legend>
          <label>Deposit amount <input type="text" name="officiant.deposit" data-path="officiant.deposit"></label>
          <label>Stripe link <input type="url" name="officiant.stripe" data-path="officiant.stripe" placeholder="https://"></label>
          <label>PayPal link <input type="url" name="officiant.paypal" data-path="officiant.paypal" placeholder="https://"></label>
        </fieldset>

        <fieldset>
          <legend>Decorations</legend>
          <label>Deposit amount <input type="text" name="decoration.deposit" data-path="decoration.deposit"></label>
          <label>Stripe link <input type="url" name="decoration.stripe" data-path="decoration.stripe" placeholder="https://"></label>
          <label>PayPal link <input type="url" name="decoration.paypal" data-path="decoration.paypal" placeholder="https://"></label>
        </fieldset>

        <fieldset>
          <legend>Candle lead time</legend>
          <label>Shared lead time <input type="text" name="candleLeadTime" data-path="candleLeadTime"></label>
        </fieldset>

        <fieldset data-candle="0">
          <legend>Candle 1</legend>
          <label>Name <input type="text" data-path="candles.0.name"></label>
          <label>Description <textarea rows="3" data-path="candles.0.description"></textarea></label>
          <label>Price <input type="text" data-path="candles.0.price"></label>
          <label>Size <input type="text" data-path="candles.0.size"></label>
          <label>Photo
            <input type="file" accept="image/jpeg,image/png,image/webp" data-candle-upload="0">
          </label>
          <input type="hidden" data-path="candles.0.image">
          <p class="hint" data-image-label="0">No image set</p>
          <label>Stripe link <input type="url" data-path="candles.0.stripe" placeholder="https://"></label>
          <label>PayPal link <input type="url" data-path="candles.0.paypal" placeholder="https://"></label>
        </fieldset>

        <fieldset data-candle="1">
          <legend>Candle 2</legend>
          <label>Name <input type="text" data-path="candles.1.name"></label>
          <label>Description <textarea rows="3" data-path="candles.1.description"></textarea></label>
          <label>Price <input type="text" data-path="candles.1.price"></label>
          <label>Size <input type="text" data-path="candles.1.size"></label>
          <label>Photo
            <input type="file" accept="image/jpeg,image/png,image/webp" data-candle-upload="1">
          </label>
          <input type="hidden" data-path="candles.1.image">
          <p class="hint" data-image-label="1">No image set</p>
          <label>Stripe link <input type="url" data-path="candles.1.stripe" placeholder="https://"></label>
          <label>PayPal link <input type="url" data-path="candles.1.paypal" placeholder="https://"></label>
        </fieldset>

        <fieldset data-candle="2">
          <legend>Candle 3</legend>
          <label>Name <input type="text" data-path="candles.2.name"></label>
          <label>Description <textarea rows="3" data-path="candles.2.description"></textarea></label>
          <label>Price <input type="text" data-path="candles.2.price"></label>
          <label>Size <input type="text" data-path="candles.2.size"></label>
          <label>Photo
            <input type="file" accept="image/jpeg,image/png,image/webp" data-candle-upload="2">
          </label>
          <input type="hidden" data-path="candles.2.image">
          <p class="hint" data-image-label="2">No image set</p>
          <label>Stripe link <input type="url" data-path="candles.2.stripe" placeholder="https://"></label>
          <label>PayPal link <input type="url" data-path="candles.2.paypal" placeholder="https://"></label>
        </fieldset>

        <fieldset>
          <legend>Misc</legend>
          <label>Notary commission expiration <input type="text" data-path="misc.notaryExpiration"></label>
          <label>Business hours <input type="text" data-path="misc.hours"></label>
          <label>YouTube URL <input type="url" data-path="misc.youtube" placeholder="https://"></label>
        </fieldset>

        <div class="actions">
          <button type="submit" class="btn btn--primary">Save</button>
          <button type="button" id="logout-btn" class="btn btn--ghost">Sign out</button>
        </div>
      </form>
    </section>
  </div>
  <script src="admin.js"></script>
</body>
</html>
